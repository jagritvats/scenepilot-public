[project]
name = "scenepilot-agent"
version = "0.1.0"
description = "ScenePilot agent service: Google ADK + Gemini + Parallel Search production intelligence and shoot rescue"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.7.1",
    "httpx>=0.28.1",
    "parallel-web>=1.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "google-adk[eval]>=2.7.1",
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scenepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
